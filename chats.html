<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chats | CHRISXCHANGE</title><link rel="icon" href="assets/chrisxchange-logo.svg"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080816;--panel:#121225;--panel2:#19192e;--line:#292943;--text:#fff;--muted:#aaaac2;--pink:#ff3cac;--blue:#4cc9f0;--green:#42e695}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,sans-serif;background:radial-gradient(circle at 10% 10%,#40163855,transparent 30%),radial-gradient(circle at 90% 90%,#123e5555,transparent 30%),var(--bg);color:var(--text)}button,input{font:inherit}.hidden{display:none!important}.top{height:70px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#080816dd;backdrop-filter:blur(16px);position:sticky;top:0;z-index:10}.brand{display:flex;gap:10px;align-items:center;color:#fff;text-decoration:none;font-weight:900}.brand img{width:42px}.brand b{color:var(--blue)}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel2);color:#fff;padding:10px 13px;border-radius:12px;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,var(--pink),#7c3aed,var(--blue));font-weight:800}.layout{height:calc(100vh - 70px);display:grid;grid-template-columns:360px 1fr;max-width:1450px;margin:auto}.side{border-right:1px solid var(--line);background:#0d0d1add;display:flex;flex-direction:column}.sidehead{padding:16px;border-bottom:1px solid var(--line)}.sidehead h2{margin:0 0 12px}.search input,.modal input,.composer input{width:100%;padding:12px;border:1px solid var(--line);background:#0a0a16;color:#fff;border-radius:12px;outline:0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.tab{min-width:0;border:0;background:transparent;color:var(--muted);padding:9px;border-radius:10px;cursor:pointer}.tab.active{background:linear-gradient(135deg,#ff3cac,#7c3aed,#4cc9f0);color:#fff;font-weight:800;box-shadow:0 6px 18px #0005}.list{overflow:auto;flex:1}.item{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid #ffffff08;cursor:pointer}.item:hover,.item.active{background:#ffffff09}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--pink),#7c3aed,var(--blue));font-weight:900}.info{min-width:0;flex:1}.info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info small{color:var(--muted)}.badge{font-size:10px;background:#ff3cac;color:#fff;border-radius:99px;padding:3px 7px}.chat{display:flex;flex-direction:column;min-width:0}.chathead{height:70px;padding:0 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line)}.messages{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:70%;padding:10px 13px;border-radius:17px;font-size:14px;line-height:1.4}.mine{align-self:flex-end;background:linear-gradient(135deg,#8b2be2,#d62976);border-bottom-right-radius:5px}.theirs{align-self:flex-start;background:#19192b;border:1px solid var(--line);border-bottom-left-radius:5px}.bubble small{display:block;text-align:right;color:#ffffff99;font-size:10px}.composer{padding:13px;border-top:1px solid var(--line);display:flex;gap:9px}.composer input{flex:1}.send{width:48px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--pink),var(--blue));color:#fff}.empty{margin:auto;text-align:center;color:var(--muted);max-width:450px}.empty i{font-size:50px;color:var(--blue);margin-bottom:15px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:30}.modalbox{width:min(520px,100%);max-height:90vh;overflow:auto;background:#121225;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 30px 100px #000}.modalbox h2{margin-top:0}.modalbox label{display:block;color:var(--muted);font-size:13px;margin:13px 0 6px}.modalactions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.checklist{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:12px}.check{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #ffffff08}.check input{width:auto}.notice{padding:10px;border-radius:10px;margin:10px 0;background:#4cc9f018;color:#a9ecff;font-size:13px}.request{display:flex;gap:8px;margin-left:auto}.request button{border:0;border-radius:9px;padding:7px 9px;cursor:pointer;font-weight:800}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.toolbar .btn{width:100%;justify-content:center;display:flex;align-items:center;gap:6px;padding:11px 8px}.sample-card{margin:14px;padding:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#17172b,#101020)}.sample-title{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}.sample-msg{padding:9px 11px;border-radius:14px;margin:6px 0;max-width:88%;font-size:13px}.sample-in{background:#202035;border:1px solid var(--line)}.sample-out{margin-left:auto;background:linear-gradient(135deg,#8b2be2,#d62976)}.accept{background:#42e695;color:#07130d}.decline{background:#ff5370;color:#fff}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{height:100%;}.chat{display:none}.layout.chatmode .side{display:none}.layout.chatmode .chat{display:flex}.bubble{max-width:85%}.brand span{display:none}}
</style></head>
<body>
<header class="top"><a class="brand" href="index.html"><img src="assets/chrisxchange-logo.svg"><span>CHRIS<b>XCHANGE</b> CHATS</span></a><div class="actions"><a class="btn" href="index.html"><i class="fa-solid fa-house"></i> Home</a><button class="btn primary" id="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button></div></header>
<main id="layout" class="layout">
<aside class="side"><div class="sidehead"><h2>💬 My Chats</h2><div class="search"><input id="search" placeholder="Search people or groups..."></div><div class="tabs"><button type="button" class="tab active" data-tab="friends">Friends</button><button type="button" class="tab" data-tab="groups">Groups</button></div><div class="toolbar"><button type="button" class="btn primary" id="addFriend"><i class="fa-solid fa-user-plus"></i> Add Friend</button><button type="button" class="btn" id="createGroup"><i class="fa-solid fa-users"></i> New Group</button><button type="button" class="btn" id="requestButton"><i class="fa-solid fa-user-clock"></i> Requests</button><button type="button" class="btn" id="sampleButton"><i class="fa-solid fa-eye"></i> Preview</button></div></div><div id="list" class="list"></div></aside>
<section class="chat"><header class="chathead"><div class="avatar" id="headAvatar">?</div><div><strong id="headName">Choose a friend or group</strong><div id="headSub" style="color:var(--muted);font-size:12px">Your CHRISXCHANGE conversations</div></div><button class="btn hidden" id="back" style="margin-left:auto">← Back</button></header><div id="messages" class="messages"><div class="empty"><i class="fa-solid fa-comments"></i><h2>Welcome to CHRISXCHANGE Chats</h2><p>Add friends, create groups and start conversations.</p></div></div><form id="composer" class="composer hidden"><input id="message" maxlength="4000" placeholder="Write a message..."><button class="send" type="submit"><i class="fa-solid fa-paper-plane"></i></button></form></section>
</main>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div>
<script>
const URL="https://wopjohlkjhqymhjjxqgi.supabase.co",KEY="sb_publishable_ZAngJWvWaTYJWUF8JZWSZQ_tGh4lDwD";let sb=null;
let me=null,profiles=[],friends=[],groups=[],mode="friends",selected=null,channel=null,ready=false;
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])), initials=s=>(s||"U").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
function openModal(html){$("modalbox").innerHTML=html;$("modal").classList.remove("hidden")}
function showPreview(){openModal('<h2>💬 CHRISXCHANGE Chat Preview</h2><p style="color:var(--muted)">This is how real conversations will appear after users connect.</p><div class="sample-card"><div class="sample-title">Private Chat • Sarah</div><div class="sample-msg sample-in">Hello Chris! Is the Samsung TV still available?</div><div class="sample-msg sample-out">Yes 👍 It is available. I can send you the price.</div><div class="sample-msg sample-in">Great. Please send me the details.</div></div><div class="sample-card"><div class="sample-title">Group Chat • Kampala Traders</div><div class="sample-msg sample-in"><b>David:</b> Who has wholesale phone accessories?</div><div class="sample-msg sample-out"><b>You:</b> I can help with chargers and earphones.</div><div class="sample-msg sample-in"><b>Mary:</b> Please share the prices.</div></div><div class="modalactions"><button class="btn primary" id="closePreview">Close Preview</button></div>');$("closePreview").onclick=closeModal}function closeModal(){$("modal").classList.add("hidden")}
$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
async function init(){try{
if(!window.supabase){$("list").innerHTML='<div class="notice">⚠️ The chat connection library did not load. Please refresh this page.</div>';return}
sb=window.supabase.createClient(URL,KEY);
const {data,error}=await sb.auth.getSession();if(error)throw error;if(!data.session){$("layout").classList.remove("hidden");$("list").innerHTML='<div class="notice" style="margin:14px">🔐 You need to log in to use CHRISXCHANGE Chats.<br><br><a class="btn primary" href="index%20html/login.html" style="display:inline-flex;text-decoration:none">Log in to CHRISXCHANGE</a></div>';$("messages").innerHTML='<div class="empty"><i class="fa-solid fa-lock"></i><h2>Login required</h2><p>Log in first, then you can add friends and create groups.</p></div>';return}me=data.session.user;$("layout").classList.remove("hidden");ready=true;window.__cxReady=true;await profile();await loadPeople();await loadFriends();await loadGroups();render();$("messages").innerHTML='<div class="empty"><i class="fa-solid fa-comments"></i><h2>Welcome to CHRISXCHANGE Chats</h2><p>Select a friend, or use <b>Add Friend</b> to start a conversation.</p></div>';subscribe()}catch(e){console.error(e);$("layout").classList.remove("hidden");$("list").innerHTML='<div class="notice">⚠️ Chats could not load. Refresh the page or log in again.</div>';$("messages").innerHTML='<div class="empty"><h2>CHRISXCHANGE Chats</h2><p>There was a connection problem loading your chats.</p></div>';}}
async function profile(){const r=await sb.from("chat_profiles").upsert({id:me.id,full_name:me.user_metadata?.full_name||me.email.split("@")[0],email:me.email,last_seen:new Date().toISOString()},{onConflict:"id"});if(r.error)throw r.error}
async function loadPeople(){const r=await sb.from("chat_profiles").select("id,full_name,email,last_seen").neq("id",me.id).order("full_name");if(r.error)throw r.error;profiles=r.data||[]}
async function loadFriends(){const r=await sb.from("friendships").select("friend_id").eq("user_id",me.id);if(r.error)throw r.error;const ids=(r.data||[]).map(x=>x.friend_id);friends=profiles.filter(p=>ids.includes(p.id))}
async function loadGroups(){const r=await sb.from("chat_group_members").select("group_id,chat_groups(id,name,description,created_by)").eq("user_id",me.id);if(r.error)throw r.error;groups=(r.data||[]).map(x=>x.chat_groups).filter(Boolean)}
function render(){const q=$("search").value.toLowerCase();let data=mode==="friends"?friends:groups;if(q)data=data.filter(x=>(x.full_name||x.name||"").toLowerCase().includes(q)||(x.email||"").toLowerCase().includes(q));$("list").innerHTML=data.length?data.map(x=>mode==="friends"?'<div class="item" data-id="'+x.id+'"><span class="avatar">'+initials(x.full_name)+'</span><span class="info"><strong>'+esc(x.full_name)+'</strong><small>'+esc(x.email)+'</small></span></div>':'<div class="item" data-id="'+x.id+'"><span class="avatar">👥</span><span class="info"><strong>'+esc(x.name)+'</strong><small>Group chat</small></span></div>').join(""):'<div class="notice" style="margin:14px">No '+mode+' yet.</div>';document.querySelectorAll(".item").forEach(x=>x.onclick=()=>mode==="friends"?openFriend(x.dataset.id):openGroup(x.dataset.id))}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.tab;render()});$("search").oninput=render;
async function openFriend(id){selected={type:"friend",id};const p=friends.find(x=>x.id===id);$("headName").textContent=p.full_name;$("headSub").textContent=p.email;$("headAvatar").textContent=initials(p.full_name);$("composer").classList.remove("hidden");$("layout").classList.add("chatmode");await messages()}
async function openGroup(id){selected={type:"group",id};const g=groups.find(x=>x.id===id);$("headName").textContent=g.name;$("headSub").textContent="Group chat";$("headAvatar").textContent="👥";$("composer").classList.remove("hidden");$("layout").classList.add("chatmode");await groupMessages()}
async function messages(){const p=selected;const r=await sb.from("messages").select("id,sender_id,receiver_id,body,created_at").or("and(sender_id.eq."+me.id+",receiver_id.eq."+p.id+"),and(sender_id.eq."+p.id+",receiver_id.eq."+me.id+")").order("created_at");renderMessages(r.data||[])}
async function groupMessages(){const r=await sb.from("group_messages").select("id,sender_id,body,created_at").eq("group_id",selected.id).order("created_at");$("messages").innerHTML=(r.data||[]).map(m=>'<div class="bubble '+(m.sender_id===me.id?"mine":"theirs")+'">'+esc(m.body)+'<small>'+new Date(m.created_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+'</small></div>').join("")||'<div class="empty"><h2>Start the group chat</h2><p>Send the first message.</p></div>';$("messages").scrollTop=$("messages").scrollHeight}
function renderMessages(rows){$("messages").innerHTML=rows.map(m=>'<div class="bubble '+(m.sender_id===me.id?"mine":"theirs")+'">'+esc(m.body)+'<small>'+new Date(m.created_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+'</small></div>').join("")||'<div class="empty"><h2>Start chatting</h2><p>Send the first message.</p></div>';$("messages").scrollTop=$("messages").scrollHeight}
$("composer").onsubmit=async e=>{e.preventDefault();if(!ready)return alert("Please wait for Chats to finish connecting.");const body=$("message").value.trim();if(!body||!selected)return;let r;if(selected.type==="friend")r=await sb.from("messages").insert({sender_id:me.id,receiver_id:selected.id,body});else r=await sb.from("group_messages").insert({group_id:selected.id,sender_id:me.id,body});if(r.error)return alert(r.error.message);$("message").value="";selected.type==="friend"?messages():groupMessages()}
$("back").onclick=()=>{$("layout").classList.remove("chatmode")};
$("addFriend").onclick=async()=>{if(!ready)return alert("Please wait for Chats to finish connecting.");openModal('<h2>➕ Add a Friend</h2><p style="color:var(--muted)">Enter your friend’s CHRISXCHANGE email address.</p><label>Email address</label><input id="friendEmail" type="email" placeholder="friend@example.com"><div class="modalactions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="sendReq">Send Friend Request</button></div>');$("cancel").onclick=closeModal;$("sendReq").onclick=async()=>{const email=$("friendEmail").value.trim().toLowerCase();const p=profiles.find(x=>x.email?.toLowerCase()===email);if(!p)return alert("That email is not registered on CHRISXCHANGE.");if(friends.some(x=>x.id===p.id))return alert("You are already friends.");const r=await sb.from("friend_requests").insert({sender_id:me.id,receiver_id:p.id});if(r.error)return alert(r.error.code==="23505"?"A request already exists.":r.error.message);closeModal();alert("Friend request sent to "+p.full_name+"!")}
async function requests(){const r=await sb.from("friend_requests").select("id,sender_id,created_at").eq("receiver_id",me.id).eq("status","pending");if(r.error){console.warn(r.error.message);return []}const ids=(r.data||[]).map(x=>x.sender_id);if(!ids.length)return [];const p=await sb.from("chat_profiles").select("id,full_name,email").in("id",ids);return (r.data||[]).map(x=>({...x,chat_profiles:(p.data||[]).find(y=>y.id===x.sender_id)||{full_name:"CHRISXCHANGE Member",email:""}}))}
$("createGroup").onclick=async()=>{if(!ready)return alert("Please wait for Chats to finish connecting.");if(!friends.length)return alert("Add at least one friend first.");openModal('<h2>👥 Create a Group</h2><label>Group name</label><input id="groupName" maxlength="80" placeholder="e.g. School Trade Club"><label>Description (optional)</label><input id="groupDesc" maxlength="300" placeholder="What is this group about?"><label>Add friends</label><div class="checklist">'+friends.map(f=>'<label class="check"><input type="checkbox" value="'+f.id+'"> '+esc(f.full_name)+' <small>'+esc(f.email)+'</small></label>').join("")+'</div><div class="modalactions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="makeGroup">Create Group</button></div>');$("cancel").onclick=closeModal;$("makeGroup").onclick=async()=>{const name=$("groupName").value.trim(),desc=$("groupDesc").value.trim(),ids=[...document.querySelectorAll(".check input:checked")].map(x=>x.value);if(!name)return alert("Enter a group name.");if(!ids.length)return alert("Select at least one friend.");const g=await sb.from("chat_groups").insert({name,description:desc,created_by:me.id}).select().single();if(g.error)return alert(g.error.message);const members=[{group_id:g.data.id,user_id:me.id,role:"owner"},...ids.map(id=>({group_id:g.data.id,user_id:id,role:"member"}))];const m=await sb.from("chat_group_members").insert(members);if(m.error)return alert(m.error.message);closeModal();await loadGroups();mode="groups";document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab==="groups"));render();alert("Group created successfully!")}
async function showRequests(){if(!ready)return alert("Please wait for Chats to finish connecting.");const rs=await requests();openModal('<h2>🤝 Friend Requests</h2>'+(rs.length?rs.map(r=>'<div class="item"><span class="avatar">'+initials(r.chat_profiles.full_name)+'</span><span class="info"><strong>'+esc(r.chat_profiles.full_name)+'</strong><small>'+esc(r.chat_profiles.email)+'</small></span><span class="request"><button class="accept" data-accept="'+r.id+'">Accept</button><button class="decline" data-decline="'+r.id+'">Decline</button></span></div>').join(""):'<p style="color:var(--muted)">No pending friend requests.</p>')+'<div class="modalactions"><button class="btn" id="closeReq">Close</button></div>');$("closeReq").onclick=closeModal;document.querySelectorAll("[data-accept]").forEach(b=>b.onclick=async()=>{const r=await sb.rpc("accept_friend_request",{request_id:b.dataset.accept});if(r.error)return alert(r.error.message);closeModal();await loadFriends();render()});document.querySelectorAll("[data-decline]").forEach(b=>b.onclick=async()=>{const r=await sb.rpc("decline_friend_request",{request_id:b.dataset.decline});if(r.error)return alert(r.error.message);closeModal()})}
function subscribe(){if(!sb)return;channel=sb.channel("chrisxchange-social").on("postgres_changes",{event:"*",schema:"public",table:"messages"},()=>selected?.type==="friend"&&messages()).on("postgres_changes",{event:"*",schema:"public",table:"group_messages"},()=>selected?.type==="group"&&groupMessages()).on("postgres_changes",{event:"*",schema:"public",table:"friendships"},async()=>{await loadFriends();render()}).subscribe()}
$("logout").onclick=async()=>{try{if(sb)await sb.auth.signOut()}finally{location.href="index%20html/login.html"}};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
$("requestButton").onclick=showRequests;$("sampleButton").onclick=showPreview;
window.addEventListener("error",e=>{const l=$("list");if(l)l.insertAdjacentHTML("afterbegin",'<div class="notice">⚠️ Chat script error: '+esc(e.message)+'</div>');});
init();</script></body></html>
