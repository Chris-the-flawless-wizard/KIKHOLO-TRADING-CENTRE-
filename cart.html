<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | CHRISXCHANGE</title><link rel="icon" href="assets/chrisxchange-logo.svg"><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,sans-serif;background:linear-gradient(135deg,#080816,#15152d);color:#fff;min-height:100vh}.top{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292943;background:#080816dd;position:sticky;top:0}.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:900}.brand img{width:42px}.brand b{color:#4cc9f0}.actions{display:flex;gap:10px}.btn{border:1px solid #292943;background:#19192e;color:#fff;padding:10px 14px;border-radius:12px;text-decoration:none;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#ff3cac,#7c3aed,#4cc9f0);font-weight:800}.wrap{width:min(900px,92%);margin:35px auto}.card{background:#121225;border:1px solid #292943;border-radius:20px;padding:22px}.cart-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #292943}.controls{display:flex;align-items:center;gap:8px}.controls button{width:34px;height:34px;border:0;border-radius:9px;background:#19192e;color:#fff;cursor:pointer}.total{font-size:22px;font-weight:900;margin-top:20px;text-align:right}.empty{text-align:center;padding:50px 10px;color:#aaaac2}.remove{color:#ff7d9a}.toast{margin:12px 0;padding:10px;border-radius:10px;background:#4cc9f018;color:#a9ecff}
</style></head><body><header class="top"><a class="brand" href="index.html"><img src="assets/chrisxchange-logo.svg"><span>CHRIS<b>XCHANGE</b> CART</span></a><div class="actions"><a class="btn" href="index.html">Home</a><button class="btn primary" id="clearCart">Clear Cart</button></div></header><main class="wrap"><div class="card"><h1>🛒 Your Cart</h1><div id="cart"></div><div id="total" class="total"></div><div id="actions" style="display:none;justify-content:flex-end;gap:10px;margin-top:18px"><button class="btn" id="continue">Continue Shopping</button><button class="btn primary" id="checkout">Checkout</button></div></div></main>
<script>
const KEY="chrisxchange-cart",cartEl=document.getElementById("cart"),totalEl=document.getElementById("total"),actions=document.getElementById("actions");
function money(n){return new Intl.NumberFormat("en-UG",{style:"currency",currency:"UGX",maximumFractionDigits:0}).format(n)}
function save(c){localStorage.setItem(KEY,JSON.stringify(c));render()}
function render(){const c=JSON.parse(localStorage.getItem(KEY)||"[]");if(!c.length){cartEl.innerHTML='<div class="empty"><h2>Your cart is empty</h2><p>Add products from a store to see them here.</p><a class="btn primary" href="index.html#shops">Explore Businesses</a></div>';totalEl.textContent="";actions.style.display="none";return}let total=0;cartEl.innerHTML=c.map((x,i)=>{total+=Number(x.price)*Number(x.quantity||1);return '<div class="cart-row"><div><strong>'+esc(x.name)+'</strong><div style="color:#aaaac2">'+money(x.price)+' each</div></div><div class="controls"><button onclick="changeQty('+i+',-1)">−</button><strong>'+x.quantity+'</strong><button onclick="changeQty('+i+',1)">+</button><button class="remove" onclick="removeItem('+i+')">Remove</button></div></div>'}).join("");totalEl.textContent="Total: "+money(total);actions.style.display="flex"}
function changeQty(i,d){const c=JSON.parse(localStorage.getItem(KEY)||"[]");if(!c[i])return;c[i].quantity=Math.max(0,(c[i].quantity||1)+d);if(!c[i].quantity)c.splice(i,1);save(c)}
function removeItem(i){const c=JSON.parse(localStorage.getItem(KEY)||"[]");c.splice(i,1);save(c)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
document.getElementById("clearCart").onclick=()=>{localStorage.removeItem(KEY);render()}
document.getElementById("continue").onclick=()=>location.href="index.html#shops";
document.getElementById("checkout").onclick=()=>alert("Checkout is ready for payment integration. Your cart is saved on this device.");
render();
</script></body></html>
