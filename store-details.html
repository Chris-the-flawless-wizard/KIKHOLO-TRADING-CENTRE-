<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Business Store | CHRISXCHANGE</title>
<link rel="icon" type="image/svg+xml" href="assets/chrisxchange-logo.svg">

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<img class="page-brand-logo" src="assets/chrisxchange-logo.svg" alt="CHRISXCHANGE logo">
<h1 id="businessName">CHRISXCHANGE</h1>


<nav>

<a href="index.html">Home</a>

<a href="stores.html">Stores</a>

<a href="cart.html">Cart</a>

</nav>


</header>



<section class="business-details">


<img id="businessImage" src="images/shop.jpg">


<h2 id="title">
Business Store
</h2>


<p id="description">
Welcome to our store.
</p>



<h2>Available Products</h2>



<div class="products">


<div class="product-card">

<img src="images/shop.jpg">

<h3 id="product1">
Product One
</h3>

<p>
Price: UGX 100,000
</p>

<button type="button" onclick="addCart(this)" data-name="Product One" data-price="100000">Add To Cart</button>


</div>



<div class="product-card">

<img src="images/shop.jpg">

<h3>
Product Two
</h3>

<p>
Price: UGX 200,000
</p>

<button type="button" onclick="addCart(this)" data-name="Product Two" data-price="200000">Add To Cart</button>


</div>



</div>


</section>



<script>


let store =
new URLSearchParams(window.location.search)
.get("store");



let title =
document.getElementById("title");

let description =
document.getElementById("description");

let image =
document.getElementById("businessImage");



if(store=="electronics")
{

title.innerHTML="Kikholo Electronics";

description.innerHTML=
"Quality electronics including TVs, radios, speakers and home appliances.";

image.src="images/electronics.jpg";

}



else if(store=="phones")
{

title.innerHTML="Chris Mobile Phones";

description.innerHTML=
"Latest smartphones, accessories and phone services.";

image.src="images/phones.jpg";

}



else if(store=="computers")
{

title.innerHTML="Kikholo Computers";

description.innerHTML=
"Laptops, computers, printers and IT accessories.";

image.src="images/computers.jpg";

}



else if(store=="furniture")
{

title.innerHTML="Modern Furniture Shop";

description.innerHTML=
"Beautiful furniture for homes and offices.";

image.src="images/furniture.jpg";

}



function addCart(button){
 const name=button?.dataset?.name || "Product";
 const price=Number(button?.dataset?.price || 0);
 const cart=JSON.parse(localStorage.getItem("chrisxchange-cart")||"[]");
 const existing=cart.find(item=>item.name===name);
 if(existing) existing.quantity=(existing.quantity||1)+1;
 else cart.push({name,price,quantity:1});
 localStorage.setItem("chrisxchange-cart",JSON.stringify(cart));
 alert(name+" added to your cart.");
}



</script>



</body>

</html>
