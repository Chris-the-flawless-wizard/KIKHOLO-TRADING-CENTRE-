<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password | CHRISXCHANGE</title><link rel="stylesheet" href="../style.css"><link rel="icon" href="../assets/chrisxchange-logo.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><main style="min-height:100vh;display:grid;place-items:center;padding:30px">
<form id="resetForm" style="width:min(460px,100%);background:rgba(255,255,255,.96);color:#111827;padding:38px;border-radius:28px;box-shadow:0 25px 70px rgba(0,0,0,.25)">
<div style="text-align:center"><img src="../assets/chrisxchange-logo.svg" style="width:72px" alt="CHRISXCHANGE"><h1>Set New Password</h1><p>Create a new password for your CHRISXCHANGE account.</p></div>
<input id="password" required autocomplete="new-password" type="password" minlength="6" placeholder="New password (6+ characters)" style="width:100%;padding:14px;margin:7px 0;border:1px solid #d1d5db;border-radius:12px">
<input id="confirm" required autocomplete="new-password" type="password" minlength="6" placeholder="Confirm new password" style="width:100%;padding:14px;margin:7px 0;border:1px solid #d1d5db;border-radius:12px">
<button type="submit" style="width:100%;margin-top:15px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff0080,#7c3aed,#0070f3);color:white;font-weight:800">Update Password</button>
<p id="message" style="text-align:center;font-size:13px;min-height:40px"></p>
<a href="login.html">← Back to Log In</a></form></main>
<script>
const sb=window.supabase.createClient("https://wopjohlkjhqymhjjxqgi.supabase.co","sb_publishable_ZAngJWvWaTYJWUF8JZWSZQ_tGh4lDwD",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById("resetForm"),message=document.getElementById("message");
sb.auth.onAuthStateChange((event,session)=>{ if(event==="PASSWORD_RECOVERY" && session) message.textContent="Recovery link verified. Choose your new password."; });
form.addEventListener("submit",async e=>{
 e.preventDefault(); const p=document.getElementById("password").value,c=document.getElementById("confirm").value;
 if(p!==c){message.style.color="#dc2626";message.textContent="Passwords do not match.";return;}
 message.style.color="#64748b";message.textContent="Updating password...";
 const {error}=await sb.auth.updateUser({password:p});
 if(error){message.style.color="#dc2626";message.textContent=error.message;return;}
 message.style.color="#16a34a";message.textContent="Password updated. You can now log in.";
 setTimeout(()=>location.href="login.html",900);
});
</script></body></html>
