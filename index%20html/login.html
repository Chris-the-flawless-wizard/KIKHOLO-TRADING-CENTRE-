<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Log In | CHRISXCHANGE</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:30px"><form id="authForm" style="width:min(460px,100%);background:rgba(255,255,255,.96);color:#111827;padding:38px;border-radius:28px;box-shadow:0 25px 70px rgba(0,0,0,.25)"><div style="text-align:center"><div style="width:62px;height:62px;margin:auto auto 15px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#ff0080,#7c3aed,#0070f3);color:#fff;font-size:24px"><i class="fa-solid fa-user"></i></div><h1>Log In</h1><p style="color:#64748b;margin:8px 0 24px">CHRISXCHANGE account access will be connected to Supabase.</p></div><input required type="email" placeholder="Email address" style="width:100%;padding:14px;margin:7px 0;border:1px solid #d1d5db;border-radius:12px"><input required type="password" placeholder="Password" style="width:100%;padding:14px;margin:7px 0;border:1px solid #d1d5db;border-radius:12px"><button type="submit" style="width:100%;margin-top:15px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff0080,#7c3aed,#0070f3);color:white;font-weight:800;cursor:pointer">Log In</button><a href="../index.html" style="display:block;text-align:center;margin-top:18px;color:#2563eb;text-decoration:none">← Back to CHRISXCHANGE</a><p id="message" style="text-align:center;color:#64748b;font-size:13px;margin-top:15px"></p></form></main><script>document.getElementById('authForm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('message').textContent='Supabase authentication will be enabled in the next connection step.'});</script></body></html>
