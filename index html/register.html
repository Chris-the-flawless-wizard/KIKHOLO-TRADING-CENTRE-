<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Account | CHRISXCHANGE</title>
<link rel="stylesheet" href="../style.css"><link rel="icon" type="image/svg+xml" href="../assets/chrisxchange-logo.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main style="min-height:100vh;display:grid;place-items:center;padding:30px">
<form id="registerForm" style="width:min(460px,100%);background:rgba(255,255,255,.96);color:#111827;padding:38px;border-radius:28px;box-shadow:0 25px 70px rgba(0,0,0,.25)">
<div style="text-align:center"><img src="../assets/chrisxchange-logo.svg" style="width:72px" alt="CHRISXCHANGE"><h1>Create Account</h1><p>Join the CHRISXCHANGE marketplace.</p></div>
<input id="name" required autocomplete="name" placeholder="Full name" style="width:100%;padding:14px;margin:7px 0;border:1px solid #d1d5db;border-radius:12px">
<input id="email" required autocomplete="email" type="email" placeholder="Email address" style="width:100%;padding:14px;margin:7px 0;border:1px solid #d1d5db;border-radius:12px">
<input id="password" required autocomplete="new-password" type="password" minlength="6" placeholder="Password (6+ characters)" style="width:100%;padding:14px;margin:7px 0;border:1px solid #d1d5db;border-radius:12px">
<input id="confirm" required autocomplete="new-password" type="password" minlength="6" placeholder="Confirm password" style="width:100%;padding:14px;margin:7px 0;border:1px solid #d1d5db;border-radius:12px">
<button type="submit" style="width:100%;margin-top:15px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff0080,#7c3aed,#0070f3);color:white;font-weight:800">Create Account</button>
<p id="message" style="text-align:center;font-size:13px;min-height:40px"></p>
<a href="login.html">Already have an account? Log in</a><br><a href="../index.html">← Back to CHRISXCHANGE</a>
</form></main>
<script>
const sb=window.supabase.createClient("https://wopjohlkjhqymhjjxqgi.supabase.co","sb_publishable_ZAngJWvWaTYJWUF8JZWSZQ_tGh4lDwD",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById("registerForm"),message=document.getElementById("message");
form.addEventListener("submit",async e=>{
 e.preventDefault(); const name=document.getElementById("name").value.trim(),email=document.getElementById("email").value.trim().toLowerCase(),password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;
 if(password!==confirm){message.style.color="#dc2626";message.textContent="Passwords do not match.";return;}
 message.style.color="#64748b";message.textContent="Creating account...";
 const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name}}});
 if(error){message.style.color="#dc2626";message.textContent=error.message;return;}
 if(data.session){message.style.color="#16a34a";message.textContent="Account created. Opening CHRISXCHANGE...";setTimeout(()=>location.href="../index.html",300);}
 else{message.style.color="#16a34a";message.textContent="Account created. Check your email to confirm your account, then log in.";}
});
</script>
</body></html>
