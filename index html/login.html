<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Log In | CHRISXCHANGE</title>
<link rel="icon" type="image/svg+xml" href="../assets/chrisxchange-logo.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:#172033;background:linear-gradient(135deg,#dff7ff,#f8ecff 48%,#fff4d8);overflow-x:hidden}body:before,body:after{content:"";position:fixed;border-radius:50%;z-index:-1;opacity:.6}body:before{width:270px;height:270px;background:#7dd3fc;top:-90px;left:-80px}body:after{width:330px;height:330px;background:#f0abfc;right:-110px;bottom:-130px}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px}.card{width:min(470px,100%);background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border:1px solid #fff;border-radius:30px;padding:30px;box-shadow:0 24px 70px rgba(43,35,91,.18);position:relative;overflow:hidden}.card:before{content:"";position:absolute;top:0;left:0;right:0;height:7px;background:linear-gradient(90deg,#06b6d4,#6366f1,#ec4899,#f59e0b)}.brand{text-align:center}.logo{width:78px;height:78px;object-fit:contain}.badge{display:inline-block;margin-top:8px;padding:7px 12px;border-radius:999px;background:#eef2ff;color:#4f46e5;font-size:12px;font-weight:800}h1{font-size:32px;margin:14px 0 8px;letter-spacing:-1px}.subtitle{margin:0 auto 22px;color:#64748b;line-height:1.5;font-size:15px}.form-group{margin:14px 0}label{display:block;font-size:13px;font-weight:800;margin-bottom:7px;color:#334155}.input-wrap{position:relative}.input-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%)}input{width:100%;padding:14px 15px 14px 44px;border:2px solid #e2e8f0;border-radius:15px;background:#fff;color:#172033;font-size:15px;outline:none}input:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.11)}.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#f1f5f9;width:34px;height:34px;border-radius:10px;cursor:pointer}.remember{display:flex;align-items:center;gap:7px;color:#475569}.remember input{width:16px;height:16px;padding:0}.login-btn,.reset-btn{width:100%;border:0;border-radius:15px;font-weight:900;cursor:pointer}.login-btn{padding:15px;color:#fff;background:linear-gradient(110deg,#06b6d4,#6366f1 50%,#ec4899);box-shadow:0 12px 25px rgba(99,102,241,.25)}.login-btn:disabled{opacity:.65;cursor:wait}.reset-btn{margin-top:10px;padding:12px;background:#f8fafc;color:#475569}.message{min-height:25px;text-align:center;font-size:13px;font-weight:700;margin:13px 0}.divider{display:flex;align-items:center;gap:10px;color:#94a3b8;font-size:12px;margin:15px 0}.divider:before,.divider:after{content:"";height:1px;background:#e2e8f0;flex:1}.create{display:block;text-align:center;text-decoration:none;background:#fff7ed;color:#c2410c;padding:12px;border-radius:14px;font-weight:900}.back{display:block;text-align:center;margin-top:16px;color:#64748b;text-decoration:none;font-size:13px;font-weight:700}.footer{text-align:center;margin-top:18px;color:#94a3b8;font-size:11px}@media(max-width:420px){.card{padding:24px}h1{font-size:28px}}
</style>
</head>
<body>
<main class="page"><form id="loginForm" class="card">
<div class="brand"><img class="logo" src="../assets/chrisxchange-logo.svg" alt="CHRISXCHANGE"><div class="badge">✨ YOUR MARKETPLACE • YOUR COMMUNITY</div><h1>Welcome Back! 👋</h1><p class="subtitle">Sign in and jump back into CHRISXCHANGE — discover, connect and trade.</p></div>
<div class="form-group"><label for="email">Email address</label><div class="input-wrap"><span class="input-icon">📧</span><input id="email" required autocomplete="email" type="email" placeholder="you@example.com"></div></div>
<div class="form-group"><label for="password">Password</label><div class="input-wrap"><span class="input-icon">🔐</span><input id="password" required autocomplete="current-password" type="password" placeholder="Enter your password"><button class="password-toggle" id="togglePassword" type="button">👁️</button></div></div>
<label class="remember"><input id="remember" type="checkbox" checked> Keep me signed in</label>
<button id="loginBtn" class="login-btn" type="submit" style="margin-top:15px">🚀 Log In to CHRISXCHANGE</button>
<button id="resetBtn" class="reset-btn" type="button">🔑 Forgot Password?</button>
<p id="message" class="message" aria-live="polite"></p>
<div class="divider">new here?</div><a class="create" href="register.html">🎓 Create Your CHRISXCHANGE Account</a><a class="back" href="../index.html">← Back to CHRISXCHANGE Home</a>
<div class="footer">Made for connecting people, ideas, businesses & opportunities.</div>
</form></main>
<script>
const SUPABASE_URL="https://wopjohlkjhqymhjjxqgi.supabase.co";
const SUPABASE_KEY="sb_publishable_ZAngJWvWaTYJWUF8JZWSZQ_tGh4lDwD";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById("loginForm"),message=document.getElementById("message"),loginBtn=document.getElementById("loginBtn");
document.getElementById("togglePassword").addEventListener("click",()=>{const p=document.getElementById("password"),b=document.getElementById("togglePassword");p.type=p.type==="password"?"text":"password";b.textContent=p.type==="password"?"👁️":"🙈"});
form.addEventListener("submit",async e=>{e.preventDefault();loginBtn.disabled=true;loginBtn.textContent="⏳ Signing you in...";message.style.color="#64748b";message.textContent="Checking your account...";const email=document.getElementById("email").value.trim().toLowerCase(),password=document.getElementById("password").value;const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){loginBtn.disabled=false;loginBtn.textContent="🚀 Log In to CHRISXCHANGE";message.style.color="#dc2626";message.textContent=error.message;return}if(!data.session){loginBtn.disabled=false;loginBtn.textContent="🚀 Log In to CHRISXCHANGE";message.style.color="#dc2626";message.textContent="Login failed: no session was created.";return}message.style.color="#16a34a";message.textContent="✅ Login successful! Opening your Chats...";loginBtn.textContent="🎉 Success!";setTimeout(()=>location.href="../chats.html",500)});
document.getElementById("resetBtn").addEventListener("click",async()=>{const email=document.getElementById("email").value.trim().toLowerCase();if(!email){message.style.color="#dc2626";message.textContent="Enter your email address first.";document.getElementById("email").focus();return}message.style.color="#64748b";message.textContent="📨 Sending password-reset email...";const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:"https://kikholo-trading-centre.vercel.app/"});if(error){message.style.color="#dc2626";message.textContent=error.message;return}message.style.color="#16a34a";message.textContent="✅ If this account exists, check your email for the reset link."});
</script>
</body></html>
