<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Log In | CHRISXCHANGE</title>
<link rel="stylesheet" href="../style.css">
<link rel="icon" type="image/svg+xml" href="../assets/chrisxchange-logo.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main style="min-height:100vh;display:grid;place-items:center;padding:30px">
<form id="loginForm" style="width:min(460px,100%);background:rgba(255,255,255,.96);color:#111827;padding:38px;border-radius:28px;box-shadow:0 25px 70px rgba(0,0,0,.25)">
<div style="text-align:center">
<img src="../assets/chrisxchange-logo.svg" style="width:72px" alt="CHRISXCHANGE">
<h1>Welcome Back</h1><p>Sign in to your CHRISXCHANGE account.</p>
</div>
<input id="email" required autocomplete="email" type="email" placeholder="Email address" style="width:100%;padding:14px;margin:7px 0;border:1px solid #d1d5db;border-radius:12px">
<input id="password" required autocomplete="current-password" type="password" placeholder="Password" style="width:100%;padding:14px;margin:7px 0;border:1px solid #d1d5db;border-radius:12px">
<label style="display:flex;gap:8px;align-items:center;margin:10px 0;font-size:14px"><input id="remember" type="checkbox" checked> Keep me signed in on this device</label>
<button type="submit" style="width:100%;margin-top:15px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff0080,#7c3aed,#0070f3);color:white;font-weight:800">Log In</button>
<button id="resetBtn" type="button" style="width:100%;margin-top:10px;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#fff;color:#374151;font-weight:700">Forgot Password?</button>
<p id="message" style="text-align:center;font-size:13px;min-height:40px"></p>
<a href="register.html">Create an account</a><br><a href="../index.html">← Back to CHRISXCHANGE</a>
</form>
</main>
<script>
const SUPABASE_URL="https://wopjohlkjhqymhjjxqgi.supabase.co";
const SUPABASE_KEY="sb_publishable_ZAngJWvWaTYJWUF8JZWSZQ_tGh4lDwD";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById("loginForm"),message=document.getElementById("message");
form.addEventListener("submit",async e=>{
 e.preventDefault();
 message.style.color="#64748b";
 message.textContent="Signing in...";
 const email=document.getElementById("email").value.trim().toLowerCase();
 const password=document.getElementById("password").value;
 const {data,error}=await sb.auth.signInWithPassword({email,password});
 if(error){message.style.color="#dc2626";message.textContent=error.message;return;}
 if(!data.session){message.style.color="#dc2626";message.textContent="Login failed: no session was created.";return;}
 message.style.color="#16a34a";
 message.textContent="Login successful. Opening CHRISXCHANGE...";
 setTimeout(()=>location.href="../index.html",300);
});
document.getElementById("resetBtn").addEventListener("click",async()=>{
 const email=document.getElementById("email").value.trim().toLowerCase();
 if(!email){
   message.style.color="#dc2626";
   message.textContent="Enter your email address first.";
   document.getElementById("email").focus();
   return;
 }
 message.style.color="#64748b";
 message.textContent="Sending password-reset email...";
 const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:"https://kikholo-trading-centre.vercel.app/"});
 if(error){
   message.style.color="#dc2626";
   message.textContent=error.message;
   return;
 }
 message.style.color="#16a34a";
 message.textContent="If this account exists, check your email for the password-reset link.";
});
</script>
</body>
</html>
