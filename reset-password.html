<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password | CHRISXCHANGE</title>
<link rel="icon" type="image/svg+xml" href="assets/chrisxchange-logo.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#dff7ff,#f8ecff 48%,#fff4d8);color:#172033}
.card{width:min(470px,100%);background:rgba(255,255,255,.94);backdrop-filter:blur(18px);padding:32px;border-radius:28px;box-shadow:0 24px 70px rgba(43,35,91,.18);text-align:center}
.logo{width:76px}.badge{display:inline-block;margin:10px 0;padding:7px 12px;border-radius:999px;background:#eef2ff;color:#4f46e5;font-size:12px;font-weight:800}
h1{margin:10px 0}.sub{color:#64748b;line-height:1.5}.group{text-align:left;margin:15px 0}.group label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}input{width:100%;padding:14px;border:2px solid #e2e8f0;border-radius:14px;font-size:15px;outline:0}input:focus{border-color:#6366f1}.btn{width:100%;padding:15px;border:0;border-radius:14px;color:#fff;font-weight:900;cursor:pointer;background:linear-gradient(110deg,#06b6d4,#6366f1 50%,#ec4899)}.btn:disabled{opacity:.65}.message{min-height:25px;margin:14px 0;font-size:13px;font-weight:700}.back{display:block;margin-top:16px;color:#64748b;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="assets/chrisxchange-logo.svg" alt="CHRISXCHANGE">
<div class="badge">🔐 SECURE ACCOUNT RECOVERY</div>
<h1>Create a New Password</h1>
<p class="sub">Choose a new password for your CHRISXCHANGE account.</p>
<form id="form">
<div class="group"><label for="password">New password</label><input id="password" type="password" minlength="6" autocomplete="new-password" required placeholder="At least 6 characters"></div>
<div class="group"><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="6" autocomplete="new-password" required placeholder="Repeat your password"></div>
<button class="btn" id="save" type="submit">Update Password</button>
<p class="message" id="message" aria-live="polite"></p>
</form>
<a class="back" href="index.html">← Back to CHRISXCHANGE</a>
</main>
<script>
const sb=window.supabase.createClient("https://wopjohlkjhqymhjjxqgi.supabase.co","sb_publishable_ZAngJWvWaTYJWUF8JZWSZQ_tGh4lDwD",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById("form"),save=document.getElementById("save"),message=document.getElementById("message");
async function start(){
  const {data,error}=await sb.auth.getSession();
  if(error||!data.session){
    message.style.color="#dc2626";
    message.textContent="This reset link is invalid or has expired. Please request a new one from the login page.";
  }
}
form.addEventListener("submit",async e=>{
 e.preventDefault();
 const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;
 if(password!==confirm){message.style.color="#dc2626";message.textContent="Passwords do not match.";return;}
 save.disabled=true;save.textContent="Updating...";
 const {error}=await sb.auth.updateUser({password});
 if(error){save.disabled=false;save.textContent="Update Password";message.style.color="#dc2626";message.textContent=error.message;return;}
 message.style.color="#16a34a";message.textContent="Password updated successfully. You can now log in.";
 save.textContent="✓ Password Updated";
 setTimeout(()=>location.href="index%20html/login.html",900);
});
start();
</script>
</body>
</html>
